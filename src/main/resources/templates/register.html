<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">
        <h3>Register</h3>

        <p style="color:red" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <input type="text" class="form-control mb-2" placeholder="Username" th:field="*{username}">
            <input type="password" class="form-control mb-2" placeholder="Password" th:field="*{password}">
            <button class="btn btn-success">Register</button>
        </form>

    </div>

</div>

</body>
</html>
