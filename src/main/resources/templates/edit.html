<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body">

            <h3>Edit Expense</h3>

            <form th:action="@{/update}" th:object="${expense}" method="post">

                <input type="hidden" th:field="*{id}" />

                <input type="text" class="form-control mb-2" th:field="*{title}">
                <input type="number" class="form-control mb-2" th:field="*{amount}">
                <input type="text" class="form-control mb-2" th:field="*{category}">
                <input type="date" class="form-control mb-2" th:field="*{date}">

                <button class="btn btn-success">Update</button>
                <a href="/" class="btn btn-secondary">Back</a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
