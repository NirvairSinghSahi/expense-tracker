<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">💰 Expense Tracker</h1>

    <!-- TOTAL CARD -->
    <div class="card text-center mb-4 shadow">
        <div class="card-body">
            <h3>Total Expenses</h3>
            <h2 class="text-success">$<span th:text="${total}"></span></h2>
        </div>
    </div>

    <!-- ADD EXPENSE -->
    <div class="card mb-4 shadow">
        <div class="card-body">
            <h4>Add Expense</h4>

            <form th:action="@{/add}" th:object="${expense}" method="post" class="row g-3">

                <div class="col-md-3">
                    <input type="text" class="form-control" placeholder="Title" th:field="*{title}" required>
                </div>

                <div class="col-md-2">
                    <input type="number" step="0.01" class="form-control" placeholder="Amount" th:field="*{amount}" required>
                </div>

                <div class="col-md-3">
                    <input type="text" class="form-control" placeholder="Category" th:field="*{category}" required>
                </div>

                <div class="col-md-2">
                    <input type="date" class="form-control" th:field="*{date}" required>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Add</button>
                </div>

            </form>
        </div>
    </div>

    <!-- FILTER -->
    <div class="card mb-4 shadow">
        <div class="card-body">
            <h4>Filter by Category</h4>

            <form action="/category" class="d-flex gap-2">
                <input type="text" name="category" class="form-control" placeholder="Enter category">
                <button class="btn btn-secondary">Search</button>
            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow">
        <div class="card-body">

            <h4>All Expenses</h4>

            <table class="table table-striped mt-3">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="e : ${expenses}">
                    <td th:text="${e.title}"></td>
                    <td>$<span th:text="${e.amount}"></span></td>
                    <td th:text="${e.category}"></td>
                    <td th:text="${e.date}"></td>

                    <td>
                        <a th:href="@{'/edit/' + ${e.id}}" class="btn btn-warning btn-sm">Edit</a>

                        <a th:href="@{'/delete/' + ${e.id}}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this expense?')">Delete</a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
